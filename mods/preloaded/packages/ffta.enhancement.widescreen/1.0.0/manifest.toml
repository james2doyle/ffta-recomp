format_version = 1
id = "ffta.enhancement.widescreen"
version = "1.0.0"
name = "FFTA Widescreen Field Margins"
author = "ffta-recompiled"
description = "Reveal the authored 512-px field rings in the margins of wide views. The world map pillarboxes and menus stay inside the native span; the default view remains faithful 240."
license = "PolyForm-Noncommercial-1.0.0"
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "ffta-us"
rom_sha1 = "4ac05441f4de70a4ec3dd932116346c61b8783d9"

[[feature]]
id = "widescreen"
name = "Widescreen Field Margins"
description = "Author the margin columns from the guest's own world instead of engine defaults. Enabled by default; the view stays 240-wide unless one is requested with --view-width (up to 448) or --resize-view."
group = "Presentation"
default_enabled = true

[[plugin]]
feature = "widescreen"
id = "ffta.widescreen"
