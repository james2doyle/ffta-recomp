# CI tier 1 — fork-safe, no private material (no ROM/BIOS/savestates).
# Runs the host unit tests (C++/Python) and patch integrity on a fresh
# checkout. The full gate (attract, widescreen smoke, route replays) needs
# game.gba + BIOS + the local fixtures and belongs on a self-hosted runner
# gated to trusted events — see README § Continuous integration.
name: CI (tier 1)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tier1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Two passes mirror the local recipe: the first init can leave nested
      # worktrees empty (arm-recomp-core), the --checkout pass fixes them.
      - name: Pinned submodules
        run: |
          git submodule update --init --recursive
          git submodule update --checkout --recursive

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libsdl2-dev libgl-dev libfreetype-dev libharfbuzz-dev

      # unit-py imports tools/misspack.py, which needs capstone. Local runs
      # always use .venv (README setup); the runner needs the same dep on
      # the interpreter that runs check.py (sys.executable). Pinned to the
      # .venv version; manylinux py3-none wheel, nothing to build.
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python deps (unit-py)
        run: python3 -m pip install "capstone==5.0.7"

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Gate (unit-cpp, unit-py, patches)
        run: python3 tools/check.py --only unit-cpp,unit-py,patches
