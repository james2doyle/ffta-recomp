# Final Fantasy Tactics Advance (USA, AFXE) — per-binary recompile config.
#
# Field semantics verified against gbarecomp @ ecc9c55:
#   - tools/gba_recompile/config.cpp (recompiler-side: [program], [identity],
#     [[extra_func]], ...) parses this file via --config.
#   - src/runtime/runtime.cpp apply_toml_file (runtime-side: [game], [bios],
#     [rom], [save], [video], [audio]) reads the same file at launch.
# Every address below is backed by disassembly evidence in BRINGUP.md
# § "2026-10-06 — Phase 0".

[game]
name = "Final Fantasy Tactics Advance"
short_name = "final_fantasy_tactics_advance"
default_region = "USA"

[program]
name = "Final Fantasy Tactics Advance (USA)"
id = "AFXE"
load_address = 0x08000000
size = 0x01000000                # 16,777,216 bytes — matches file exactly
# The real BIOS hands off to the cart at 0x08000000 (runtime.cpp:2005
# bios_hle_boot_skip(0x08000000); BIOS-mapped cart entry). Word at
# 0x08000000 is `ea00002e  b 0x080000C0` (Phase 0 disassembly; confirmed by
# gba_scan entry_target=0x080000c0). Seeding 0x08000000 recompiles the branch
# itself and the walk reaches crt0 at 0x080000C0.
entry_pc = 0x08000000
# Evidence-driven strict-static discovery (same policy as the DBZ reference
# repo): no speculative literal harvesting; runtime-observed roots get seeded
# through the Phase 4 audit loop instead.
speculative_literal_harvest = false
aot_scan_start = 0x080000C0     # crt0 start, past the header/logo bytes
aot_scan_end = 0x08010000       # initial ~64KB sweep; rest via runtime misses
static_resume_all = true        # IRQ/SWI may resume at any instruction boundary
codegen_shards = 32

[identity]
sha1 = "4ac05441f4de70a4ec3dd932116346c61b8783d9"
md5 = "cd99cdde3d45554c1b36fbeb8863b7bd"

[bios]
path = "gbarecomp/bios/gba_bios.bin"
sha1 = "300c20df6731a33952ded8c436f7f186d25d3492"
hle = false                     # LLE: recompiled real BIOS required (user dump)

[rom]
path = "game.gba"
sha1 = "4ac05441f4de70a4ec3dd932116346c61b8783d9"

# Save type resolved empirically: ASCII signature "FLASH512_V130" at ROM
# 0x0836CE28 (verified by direct byte inspection 2026-10-06; gba_scan
# agrees: save_type=Flash 64KB (512 Kbit), signature FLASH512_V).
# No FLASH1M/SRAM/EEPROM signatures exist anywhere in the ROM.
[save]
type = "flash512"
size = 65536
path = "saves/ffta_us.sav"

[video]
screen = "raw"                  # exact BGR555 passthrough during bring-up
view_width = 240                # faithful 240x160
resize_view = false

[audio]
shadow = false                  # no MP2K shadow mixer; recompiled canon only

# Informational only (runtime does not parse [runtime] keys; real values are
# CMake compile definitions — see Phase 3 CMakeLists, DBZ reference pattern).
[runtime]
debug_port = 19888
window_title = "FFTARecomp"

# ── Evidence-backed function seeds (Phase 0 disassembly) ──────────────
# ROM IRQ dispatcher: crt0 computes 0x080000FC (add r0, pc, #0x18 at
# 0x080000DC) and stores it to the BIOS IRQ-handler pointer 0x03007FFC
# (str r0, [r1] at 0x080000E0, r1 = literal 0x03007FFC at 0x0800023C).
# The BIOS IRQ dispatcher jumps through that pointer — no static branch
# reaches this function, so it must be seeded.
[[extra_func]]
addr = 0x080000FC
mode = "arm"
name = "rom_irq_dispatcher"
note = "Installed to 0x03007FFC by crt0 (str at 0x080000E0); ARM entry, reads IF at 0x04000200 via mov/add at 0x080000FC-0x08000110"

# Thumb main: crt0 loads literal 0x08000255 (LSB=1, at 0x08000240) into r1
# and tail-calls it (mov lr, pc at 0x080000E8; bx r1 at 0x080000EC).
# Entry 0x08000254 verified as Thumb code (push {r7,lr}; mov r7, sp).
[[extra_func]]
addr = 0x08000254
mode = "thumb"
name = "main"
note = "Thumb entry via bx r1 at 0x080000EC from literal 0x08000255 @ 0x08000240; prologue push {r7,lr} verified"

# ── Phase 4 audit seeds (runtime miss-driven, 2026-10-06) ─────────────
# Audit entry #1 — miss 0x080004D8 (interior resume/call target; the
# finder never rooted the containing function). Evidence: function
# starts 0x080004B0 — `80b5 push {r7, lr}` + `mov r7, sp` @0x080004B2,
# right after the previous function's literal pool [0x080004A0,
# 0x080004B0) (its 4 words consumed by ldr [pc] sites at 0x0800046C/
# 0x08000482/0x08000484/0x08000488). Miss PC 0x080004D8 is the
# `bne` join @0x080004CE (also a bl 0x080012BC call site). Ends
# `pop {r7}; pop {r0}; bx r0` @0x0800051E..22 + pool [0x08000524,
# 0x0800052C); next root 0x0800052C already emitted. No BL anywhere
# targets 0x080004B0 (ROM-wide scan) — only ref is thumb pointer
# 0x080004B1 in a table @0x08149434. Walk from this seed also roots
# 0x080006D0 (bl @0x080004B8), 0x08000718 (bl @0x080004D0),
# 0x080012BC (bl @0x080004D8).
[[extra_func]]
addr = 0x080004B0
mode = "thumb"
note = "prologue push {r7,lr} @0x080004B0 after prev func's pool [0x080004A0,0x080004B0); contains resume-miss 0x080004D8 (bne join @0x080004CE); ends bx r0 @0x08000522; only ref: thumb ptr 0x080004B1 @0x08149434"

# ── IWRAM code copies (live-IWRAM-dump evidence, 2026-10-06) ──────────
# Audit entry #2 — the game copies its IRQ dispatcher (the ROM region
# seeded above as rom_irq_dispatcher, ROM 0x080000FC..0x0800025C) into
# IWRAM and re-points the IRQ vector at the copy. Evidence: exit-time
# GBARECOMP_IWRAM_DUMP of the 480-frame run is byte-identical over
# [0x03000F10, 0x03001070) ← [0x080000FC, 0x0800025C) and the next
# bytes differ on both sides (copy extent). Cold 480-frame run dispatch
# misses: 0x03000F10 (IRQ entry; disasm `mov r3,#0x4000000; add r3,
# 0x200; ldr r2,[r3]` == ROM 0x080000FC) and 0x03000FD8 (copy of ROM
# 0x080001C4, the IRQ exit/restore path entered as the return target of
# the callback `stmdb sp!,{lr}; bx r0` idiom @ROM 0x080001B8-C0; disasm
# `ldm sp!,{lr}; mrs r3,apsr; bic #0xdf; orr #0x92; ...` identical).
[[code_copy]]
runtime_start = 0x03000F10
source_start = 0x080000FC
size = 0x00000160
name = "iwram_irq_dispatcher"
note = "byte-identical span in exit-time IWRAM dump; runtime copy of rom_irq_dispatcher (0x080000FC..0x0800025C)"

[[extra_func]]
addr = 0x03000F10
mode = "arm"
source_addr = 0x080000FC
name = "iwram_irq_entry"
note = "runtime copy of rom_irq_dispatcher @0x080000FC; cold-run miss x200; disasm at 0x03000F10 identical to ROM 0x080000FC"

[[extra_func]]
addr = 0x03000FD8
mode = "arm"
source_addr = 0x080001C4
name = "iwram_irq_exit"
note = "runtime copy of 0x080001C4 (IRQ exit/restore path; return target of callback bx-r0 idiom @0x080001B8-C0); cold-run miss x200; body `ldm sp!,{lr}; mrs r3,apsr; bic/orr/msr; pop {r0,r1,r3,lr}; msr spsr_fc,r0; bx lr` matches ROM"

