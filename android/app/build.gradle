plugins {
    id "com.android.application"
}

// Engine checkout: the gbarecompx framework submodule (james2doyle/gbarecompx)
// beside this project — the same root the desktop CMake sets as GBARECOMP_ROOT.
// A feature worktree can be selected with -PgbarecompRoot=... (or the
// GBARECOMP_ROOT environment variable).
def gameRoot = rootDir.parentFile
def pick = { String prop, String env, File fallback ->
    def v = providers.gradleProperty(prop).orNull ?: System.getenv(env)
    return v ? new File(v) : fallback
}
def engineRoot = pick("gbarecompRoot", "GBARECOMP_ROOT",
    new File(gameRoot, "gbarecompx"))

ext.gbaGame = [
    applicationId : "org.gbarecomp.fftarecomp",
    versionCode   : 3,
    versionName   : "2.1",
    title         : "Final Fantasy Tactics Advance",
    romLabel      : "Final Fantasy Tactics Advance (USA) ROM",
    romSha1       : ["4ac05441f4de70a4ec3dd932116346c61b8783d9"],
    romSize       : 16777216,
    romFile       : "ffta_usa.gba",
    // Clean-room emibios (LGPL-3.0-or-later, issue #17): pinned as the
    // launch BIOS and staged into the payload (bios/ dir below) — bundled
    // with every APK, so no user-supplied BIOS dump. The manifest pin
    // matches game_android.toml [bios].sha1 (enforced: android-static).
    biosSha1      : "0c0d404d16c6b55b3071aba714f82077da132f14",
    biosRequired  : false,
    // Issue #20: optional battery-save import on the setup screen (desktop
    // parity). Basename matches game_android.toml [save].path (and game.toml
    // [save].path); size pins the 512-Kbit flash image (65536). The setup
    // card validates this size and mirrors to external saves/ (enforced:
    // android-static).
    saveFile      : "ffta_us.sav",
    saveSize      : 65536,
    orientation   : "landscape",
    payloadVersion: "6",
    setupNote     : "Landscape tactics: use the on-screen pad and buttons; " +
                    "long-press or three-finger tap for the runtime settings menu.",
    variant       : "final_fantasy_tactics_advance",
    gameToml      : new File(rootDir, "game_android.toml"),
    payloadDirs   : [
        [from: new File(gameRoot, "bios/emibios_gba_bios.bin"), into: "bios"],
        [from: new File(gameRoot, "mods/preloaded"), into: "mods"],
        [from: new File(rootDir, "payload/mods"), into: "mods"],
    ],
    gameRoot      : gameRoot,
    engineRoot    : engineRoot,
    launchBoxartRes: new File(gameRoot, "recomp/launcher/boxart.png"),
]

apply from: new File(engineRoot, "platform/android/gbarecomp-app.gradle")

// Launch-screen box art: the engine template stages it as
// drawable-nodpi/launcher_boxart.png when launchBoxartRes is set (resolved
// by name via getIdentifier — the engine's Java stays namespace-agnostic).
// Source: the tracked recomp/launcher/boxart.png — the same file the desktop
// CMake stage_boxart target and the release packager stage; no second copy.
// (Supersedes the game-local staging task: the template mechanism is the
// generalized home, 2026-10-16.)
